# Azure App Service Deployment Workflow
#
# Prerequisites:
# 1. Azure App Service (Linux, Node.js 24 LTS)
# 2. AZURE_CREDENTIALS secret (service principal JSON)
#    Create: az ad sp create-for-rbac --name "github-deploy" --role contributor \
#            --scopes /subscriptions/{sub-id}/resourceGroups/{rg-name} --json-auth
# 3. Environment secrets: AUTH_SECRET, AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET, DATABASE_URL
# 4. Repository variables: AZURE_WEBAPP_NAME, AZURE_RESOURCE_GROUP, NEXTAUTH_URL, NEXT_PUBLIC_SITE_URL
# 5. Startup command: "bash start.sh" (Azure Portal > Configuration > General settings)
# 6. Optional: DISCORD_BOT_TOKEN, GITHUB_TOKEN, GITHUB_REPO in App Service Configuration
#    (Discord bot runs alongside Next.js if DISCORD_BOT_TOKEN is set)

name: "Deploy: Azure App Service"

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  NODE_VERSION: '24.x'
  NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || vars.NEXTAUTH_URL }}
  NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || vars.NEXTAUTH_URL }}
  NEXT_PUBLIC_DEMO_HOSTNAMES: ${{ vars.NEXT_PUBLIC_DEMO_HOSTNAMES || 'demo.localhost' }}
  NEXT_PUBLIC_DEMO_URL: ${{ vars.NEXT_PUBLIC_DEMO_URL || 'http://demo.localhost:3000' }}
  NEXT_PUBLIC_FORCE_DEMO: ${{ vars.NEXT_PUBLIC_FORCE_DEMO || 'false' }}
  NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'Average Joe Trades' }}
  NEXT_PUBLIC_REPOSITORY_URL: ${{ vars.NEXT_PUBLIC_REPOSITORY_URL }}
  NEXT_PUBLIC_SUPPORT_URL: ${{ vars.NEXT_PUBLIC_SUPPORT_URL }}
  NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
  NEXT_PUBLIC_LEGAL_ENTITY_NAME: ${{ vars.NEXT_PUBLIC_LEGAL_ENTITY_NAME }}
  NEXT_PUBLIC_COPYRIGHT_NAME: ${{ vars.NEXT_PUBLIC_COPYRIGHT_NAME || 'Average Joe Trades contributors' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '!node_modules/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: |
          echo "::group::Installing npm packages"
          npm ci --prefer-offline --no-audit
          echo "::endgroup::"

      - name: Check for code changes
        id: check-changes
        run: |
          # Check if any source files changed (skip lint/test for docs-only)
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -qE '\.(ts|tsx|js|jsx|json|prisma)$'; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping lint/test - no code changes detected"
          fi

      - name: Lint and test
        if: steps.check-changes.outputs.code_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "::group::Running lint and tests in parallel"
          npm run lint & npm run test:run & wait
          echo "::endgroup::"

      - name: Build
        run: |
          echo "::group::Generating Prisma client"
          npx prisma generate
          echo "::endgroup::"
          echo "::group::Building Next.js application"
          npm run build
          echo "::endgroup::"
        env:
          NODE_ENV: production
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ env.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_DEMO_HOSTNAMES: ${{ env.NEXT_PUBLIC_DEMO_HOSTNAMES }}
          NEXT_PUBLIC_DEMO_URL: ${{ env.NEXT_PUBLIC_DEMO_URL }}
          NEXT_PUBLIC_FORCE_DEMO: ${{ env.NEXT_PUBLIC_FORCE_DEMO }}
          NEXT_PUBLIC_APP_NAME: ${{ env.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_REPOSITORY_URL: ${{ env.NEXT_PUBLIC_REPOSITORY_URL }}
          NEXT_PUBLIC_SUPPORT_URL: ${{ env.NEXT_PUBLIC_SUPPORT_URL }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ env.NEXT_PUBLIC_SUPPORT_EMAIL }}
          NEXT_PUBLIC_LEGAL_ENTITY_NAME: ${{ env.NEXT_PUBLIC_LEGAL_ENTITY_NAME }}
          NEXT_PUBLIC_COPYRIGHT_NAME: ${{ env.NEXT_PUBLIC_COPYRIGHT_NAME }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Bundle Discord bot
        run: |
          echo "::group::Bundling Discord bot"
          npx esbuild discord/bot.ts --bundle --platform=node --target=node24 --format=cjs --outfile=discord-bot.cjs
          BOT_SIZE=$(du -h discord-bot.cjs | cut -f1)
          echo "✅ Discord bot bundled: $BOT_SIZE"
          echo "::endgroup::"

      - name: Package
        run: |
          echo "📦 Preparing standalone package..."
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cp discord-bot.cjs .next/standalone/
          cp start.sh .next/standalone/
          cd .next/standalone && zip -rq ../../deploy.zip .
          PACKAGE_SIZE=$(du -h ../../deploy.zip | cut -f1)
          echo "✅ Package created: $PACKAGE_SIZE"
          echo "### 📦 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Package size: **$PACKAGE_SIZE**" >> $GITHUB_STEP_SUMMARY
          echo "- Discord bot: **included**" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy
        run: |
          echo "🚀 Starting deployment to Azure..."
          echo "   App: ${{ env.AZURE_WEBAPP_NAME }}"
          echo "   Resource Group: ${{ env.AZURE_RESOURCE_GROUP }}"
          START_TIME=$(date +%s)

          az webapp deploy \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --src-path deploy.zip \
            --type zip \
            --clean true \
            --restart true \
            --timeout 600

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "✅ Deployment completed in ${DURATION}s"
          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: **${DURATION}s**" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ env.NEXTAUTH_URL }}" >> $GITHUB_STEP_SUMMARY

      - name: Health check
        run: |
          echo "🏥 Running health check..."
          echo "   URL: ${{ env.NEXTAUTH_URL }}"

          # Start checking immediately, no fixed wait
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "${{ env.NEXTAUTH_URL }}" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE) on attempt $i"
              echo "### ✅ Health Check" >> $GITHUB_STEP_SUMMARY
              echo "- Status: **Passed**" >> $GITHUB_STEP_SUMMARY
              echo "- HTTP Code: $HTTP_CODE" >> $GITHUB_STEP_SUMMARY
              echo "- Attempts: $i" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo "⏳ Attempt $i/10: HTTP $HTTP_CODE, retrying in 5s..."
            sleep 5
          done

          echo "❌ Health check failed after 10 attempts"
          echo "### ❌ Health Check" >> $GITHUB_STEP_SUMMARY
          echo "- Status: **Failed**" >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Logout
        if: always()
        run: az logout

  migrate:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    # Check all commits in push, not just head commit
    if: contains(toJSON(github.event.commits.*.modified), 'prisma/schema.prisma')
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci --prefer-offline --no-audit

      - name: Run migrations
        run: |
          echo "🔄 Running database migrations..."
          npx prisma generate
          npx prisma db push --skip-generate
          echo "✅ Migrations completed"
          echo "### 🗄️ Database Migration" >> $GITHUB_STEP_SUMMARY
          echo "- Status: **Completed**" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
