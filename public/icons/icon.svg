<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="#09090b"/>

  <!-- Subtle grid pattern for depth -->
  <g opacity="0.08" stroke="#00c805" stroke-width="1">
    <line x1="128" y1="80" x2="128" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="384" y1="80" x2="384" y2="432"/>
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="352" x2="432" y2="352"/>
  </g>

  <!-- Upward trending line (gradient for glow effect) -->
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c805" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00c805" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main chart line - upward trend -->
  <polyline
    points="100,340 180,300 260,320 340,200 420,120"
    fill="none"
    stroke="url(#lineGrad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Candlesticks -->
  <!-- Red candle (bearish) -->
  <g>
    <line x1="180" y1="280" x2="180" y2="340" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <rect x="168" y="290" width="24" height="40" rx="4" fill="#ef4444"/>
  </g>

  <!-- Green candle (bullish) -->
  <g>
    <line x1="260" y1="280" x2="260" y2="360" stroke="#00c805" stroke-width="4" stroke-linecap="round"/>
    <rect x="248" y="290" width="24" height="50" rx="4" fill="#00c805"/>
  </g>

  <!-- Large green candle (bullish breakout) -->
  <g>
    <line x1="340" y1="160" x2="340" y2="260" stroke="#00c805" stroke-width="4" stroke-linecap="round"/>
    <rect x="324" y="180" width="32" height="60" rx="4" fill="#00c805"/>
  </g>

  <!-- Arrow pointing up at the end -->
  <g filter="url(#glow)">
    <polygon points="420,120 400,155 410,150 410,180 430,180 430,150 440,155" fill="#00c805"/>
  </g>

  <!-- "AJ" text badge -->
  <g>
    <rect x="80" y="390" width="80" height="42" rx="12" fill="#00c805"/>
    <text x="120" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#09090b" text-anchor="middle">AJ</text>
  </g>
</svg>
